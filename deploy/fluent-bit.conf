[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

# The services print one JSON object per line; lift its fields to the top level.
[FILTER]
    Name         parser
    Match        svc.*
    Key_Name     log
    Parser       json
    Reserve_Data On

[OUTPUT]
    Name             http
    Match            svc.*
    Host             ${DETECTOR_HOST}
    Port             9000
    URI              /ingest
    Format           json
    json_date_key    shipped_at
    json_date_format iso8601
    Retry_Limit      5

# Also keep a copy on disk = our published demo dataset.
[OUTPUT]
    Name         file
    Match        svc.*
    Path         /data/raw_logs
    Format       plain
